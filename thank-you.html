<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thank You | AKMU Team</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .thank-you-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 40px 24px; text-align: center; }
    .thank-you-card { background: var(--card); padding: 60px 40px; border-radius: var(--radius-lg); box-shadow: var(--shadow-lg); border: 1px solid var(--border); max-width: 560px; }
    .thank-you-icon { width: 90px; height: 90px; margin: 0 auto 24px; border-radius: 50%; background: linear-gradient(135deg, var(--primary), var(--accent)); display: flex; align-items: center; justify-content: center; color: #fff; font-size: 40px; box-shadow: 0 12px 32px rgba(14, 165, 233, 0.4); }
    .thank-you-card h1 { font-size: 32px; font-weight: 900; margin-bottom: 12px; letter-spacing: -1px; }
    .thank-you-card p { color: var(--text-soft); margin-bottom: 28px; line-height: 1.7; }
  </style>
</head>
<body>
  <div class="thank-you-wrap">
    <div class="thank-you-card">
      <div class="thank-you-icon"><i class="fas fa-check"></i></div>
      <h1>Thank You!</h1>
      <p>Your message has been received.<br>We'll get back to you as soon as possible.</p>
      <a href="index.html" class="btn btn-primary"><i class="fas fa-arrow-left"></i> Back to Home</a>
    </div>
  </div>
</body>
</html>
